<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner tests</title>
<style>
  :root { --bg: #F5F1E8; --ink: #1C1B19; --ok: #3F7D58; --bad: #C8372D; --muted: #6B665C; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #summary { font-size: 16px; font-weight: 600; margin: 8px 0 12px; }
  .pass { color: var(--ok); } .fail { color: var(--bad); }
  pre { white-space: pre-wrap; background: #FFFDF7; border: 1px solid #E3DCCB; padding: 8px; max-height: 60vh; overflow: auto; }
  details { margin: 6px 0; }
</style>
</head>
<body>
<h1>Kitaeru planner tests</h1>
<div id="summary">Running…</div>
<pre id="fails"></pre>
<details><summary>Sample weeks</summary><pre id="sample"></pre></details>
<script type="module">
import { EXERCISES, ALL_EXERCISES, ALL_BY_ID, ALL_FAMILIES, FAMILIES, byId as visibleById, flowSeconds, flowSteps, familyLadder, varietyFor, isVisible } from '../js/data/exercises.js';
import { TRADITIONS, EXCLUDED_TRADITIONS, RADIO_TAISO_ATTRIBUTION, setTraditionPreview, traditionPreview, traditionVisible, contentVisible } from '../js/data/traditions.js';
import { MUSCLE_IDS } from '../js/data/muscles.js';
import { hasAnimation, exerciseAnimated, registerAnimationIds, clearRegisteredAnimationIds, animationGateVersion } from '../js/data/animated.js';
import { ANIMS } from '../js/anim/poses.js';
import { V2_IDS, V2_DRAFT } from '../js/anim/v2/ids.js';
import * as P from '../js/engine/planner.js';

const byId = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
let pass = 0, fail = 0;
const fails = [];
function ok(cond, msg) { if (cond) pass++; else { fail++; if (fails.length < 300) fails.push(msg); } }
const clone = o => JSON.parse(JSON.stringify(o));
const ALL_EQ = ['pullup_bar', 'dip_bars', 'rings', 'parallettes', 'resistance_band', 'bench', 'table', 'wall'];
const PUSH = ['push_horizontal', 'push_vertical', 'dip'], PULL = ['pull_vertical', 'pull_horizontal', 'pull_noequip'], HPULL = ['pull_horizontal', 'pull_noequip'];
const dflt = { 2: [1, 4], 3: [1, 3, 5], 4: [1, 2, 4, 5], 5: [1, 2, 3, 5, 6], 6: [1, 2, 3, 4, 5, 6] };

function mk(o = {}) {
  const days = o.daysPerWeek || 3;
  const bmi = o.bmi || 22, h = 175;
  const p = {
    name: 'T', goals: ['strength'], primaryGoal: 'strength', daysPerWeek: days, minutesPerSession: 30, preferredDays: dflt[days],
    age: 35, sex: 'male', heightCm: h, weightKg: Math.round(bmi * (h / 100) ** 2 * 10) / 10, units: 'metric', experience: 'some',
    baseline: { pushUps: null, pullUps: null, squats: null, plankSec: null }, injuries: [], equipment: [], space: 'medium', lowImpact: false, ...o,
  };
  if (o.primaryGoal && !o.goals) p.goals = [o.primaryGoal];
  delete p.bmi;
  return p;
}

const grid = [
  mk({ daysPerWeek: 2, minutesPerSession: 10 }),
  mk({ daysPerWeek: 2, minutesPerSession: 90, equipment: ALL_EQ }),
  mk({ daysPerWeek: 3, minutesPerSession: 20, equipment: ALL_EQ, primaryGoal: 'muscle' }),
  mk({ daysPerWeek: 3, minutesPerSession: 45, primaryGoal: 'endurance' }),
  mk({ daysPerWeek: 4, minutesPerSession: 15 }),
  mk({ daysPerWeek: 4, minutesPerSession: 60, equipment: ALL_EQ, experience: 'regular' }),
  mk({ daysPerWeek: 5, minutesPerSession: 30, primaryGoal: 'health' }),
  mk({ daysPerWeek: 5, minutesPerSession: 50, equipment: ALL_EQ, primaryGoal: 'muscle', experience: 'regular' }),
  mk({ daysPerWeek: 6, minutesPerSession: 25, experience: 'regular' }),
  mk({ daysPerWeek: 6, minutesPerSession: 75, equipment: ALL_EQ, experience: 'advanced' }),
  mk({ injuries: ['wrist'], daysPerWeek: 3, minutesPerSession: 30 }),
  mk({ injuries: ['elbow'], daysPerWeek: 4, minutesPerSession: 45, equipment: ALL_EQ, experience: 'regular' }),
  mk({ injuries: ['shoulder'], daysPerWeek: 3, minutesPerSession: 40, equipment: ['pullup_bar', 'table'] }),
  mk({ injuries: ['neck'], daysPerWeek: 2, minutesPerSession: 60, equipment: ALL_EQ }),
  mk({ injuries: ['lower_back'], daysPerWeek: 5, minutesPerSession: 35, experience: 'regular' }),
  mk({ injuries: ['hip'], daysPerWeek: 3, minutesPerSession: 25, equipment: ['bench'] }),
  mk({ injuries: ['knee'], daysPerWeek: 4, minutesPerSession: 30 }),
  mk({ injuries: ['ankle'], daysPerWeek: 6, minutesPerSession: 60, equipment: ALL_EQ, experience: 'regular' }),
  mk({ space: 'small', daysPerWeek: 3, minutesPerSession: 30 }),
  mk({ space: 'small', daysPerWeek: 4, minutesPerSession: 40, equipment: ALL_EQ }),
  mk({ age: 16, daysPerWeek: 3, minutesPerSession: 30 }),
  mk({ age: 16, daysPerWeek: 5, minutesPerSession: 60, equipment: ALL_EQ, experience: 'advanced' }),
  mk({ age: 70, daysPerWeek: 3, minutesPerSession: 30, primaryGoal: 'health' }),
  mk({ age: 70, daysPerWeek: 6, minutesPerSession: 45, equipment: ALL_EQ }),
  mk({ bmi: 34, daysPerWeek: 3, minutesPerSession: 40 }),
  mk({ bmi: 34, daysPerWeek: 4, minutesPerSession: 20, equipment: ALL_EQ }),
  mk({ bmi: 37, daysPerWeek: 5, minutesPerSession: 30, experience: 'new', sex: 'female' }),
  mk({ primaryGoal: 'flexibility', goals: ['flexibility', 'health'], daysPerWeek: 4, minutesPerSession: 40 }),
  mk({ primaryGoal: 'skill', goals: ['skill', 'strength'], daysPerWeek: 5, minutesPerSession: 30, equipment: ALL_EQ, baseline: { pushUps: 25, pullUps: 5, squats: 40, plankSec: 60 } }),
  mk({ experience: 'new', sex: 'female', baseline: { pushUps: 0, pullUps: 0, squats: 12, plankSec: 15 }, daysPerWeek: 3, minutesPerSession: 30, equipment: ['wall', 'table'] }),
  mk({ experience: 'advanced', baseline: { pushUps: 45, pullUps: 15, squats: 80, plankSec: 120 }, daysPerWeek: 6, minutesPerSession: 90, equipment: ALL_EQ, space: 'large' }),
  mk({ injuries: ['knee', 'shoulder', 'wrist'], daysPerWeek: 3, minutesPerSession: 12 }),
  mk({ age: 58, daysPerWeek: 4, minutesPerSession: 35, equipment: ['resistance_band', 'wall'] }),
  mk({ primaryGoal: 'strength', goals: ['strength', 'muscle'], daysPerWeek: 4, minutesPerSession: 60, equipment: ALL_EQ, experience: 'regular' }),
  mk({ primaryGoal: 'endurance', goals: ['endurance', 'health'], age: 45, daysPerWeek: 2, minutesPerSession: 45, space: 'large' }),
];

const allItems = s => s.blocks.flatMap(b => b.items);
const mainIt = w => w.sessions.flatMap(s => s.blocks.filter(b => b.kind === 'main').flatMap(b => b.items));
const mainSets = w => mainIt(w).reduce((t, i) => t + i.sets, 0);
const avail = (p, fams) => EXERCISES.some(e => fams.includes(e.family) && P.isAvailable(e, p));
const tag = (p, i) => `#${i} d${p.daysPerWeek} m${p.minutesPerSession} age${p.age} inj[${p.injuries}] eq${p.equipment.length} ${p.space} ${p.primaryGoal}`;

let sessionsChecked = 0, worstDev = 0;
grid.forEach((p, gi) => {
  const T = tag(p, gi);
  let levels;
  try { levels = P.initialLevels(p, EXERCISES); } catch (e) { ok(false, `${T}: initialLevels threw ${e.stack}`); return; }
  for (const [f, id] of Object.entries(levels)) ok(byId[id] && byId[id].family === f && P.isAvailable(byId[id], p), `${T}: initial level ${f}=${id} unavailable/wrong family`);
  const weeks = [];
  for (let w = 0; w < 11; w++) {
    let wk;
    try { wk = P.generateWeek(p, levels, EXERCISES, w); } catch (e) { ok(false, `${T} w${w}: generateWeek threw ${e.stack}`); continue; }
    weeks[w] = wk;
    const WT = `${T} w${w}`;
    ok(wk.sessions.length === p.daysPerWeek, `${WT}: ${wk.sessions.length} sessions`);
    ok(Object.values(wk.days).filter(Boolean).length === p.daysPerWeek && p.preferredDays.every(d => wk.days[d]), `${WT}: days map wrong ${JSON.stringify(wk.days)}`);
    for (const s of wk.sessions) {
      const ids = allItems(s).map(i => i.exerciseId);
      ok(new Set(ids).size === ids.length, `${WT} ${s.id}: duplicate exercise ${ids}`);
      for (const it of allItems(s)) {
        const ex = byId[it.exerciseId];
        ok(ex && P.isAvailable(ex, p), `${WT} ${s.id}: unavailable ${it.exerciseId}`);
        ok(it.sets >= 1 && (it.reps || it.holdSec) && !(it.reps && it.holdSec), `${WT} ${s.id}: bad prescription ${JSON.stringify(it)}`);
        if (ex && ex.mode === 'hold' && it.family !== 'conditioning') ok(!!it.holdSec, `${WT}: hold exercise ${it.exerciseId} without holdSec`);
      }
      ok(s.estMinutes === P.estimateMinutes(s, EXERCISES), `${WT} ${s.id}: estMinutes mismatch`);
      ok(typeof s.name === 'string' && s.name.length > 2 && /^[A-Z]$/.test(s.id), `${WT}: bad id/name ${s.id} ${s.name}`);
      const hasPush = allItems(s).some(i => PUSH.includes(i.family));
      const barOnly = p.equipment.includes('pullup_bar') && !p.equipment.includes('rings') && !p.equipment.includes('table') && avail(p, ['pull_vertical']);
      if (hasPush && avail(p, HPULL)) ok(allItems(s).some(i => HPULL.includes(i.family) || (barOnly && i.family === 'pull_vertical')), `${WT} ${s.id}: push without horizontal pull`);
      // QA #2: primary lifts reach 3 sets (strength/muscle) before any accessory is added
      const main = s.blocks.find(b => b.kind === 'main');
      const early = w <= 1 && (p.age >= 65 || (p.goals.length === 1 && p.goals[0] === 'health'));
      if (main && wk.phase === 'build' && !early && ['strength', 'muscle'].includes(p.primaryGoal) && s.focus.includes('legs')) {
        const acc = main.items.some(i => i.family === 'calves' || /Balance/.test(i.notes));
        const firsts = ['push', 'pull', 'legs'].map(pt => main.items.find(i => (pt === 'push' ? PUSH : pt === 'pull' ? PULL : ['squat', 'hinge']).includes(i.family))).filter(Boolean);
        if (acc) ok(firsts.every(i => i.sets >= 3), `${WT} ${s.id}: accessory added while a primary lift has < 3 sets ${firsts.map(i => i.exerciseId + ':' + i.sets)}`);
      }
      if (wk.phase === 'build' && wk.meta.reentry == null) {
        const M = p.minutesPerSession, est = P.estimateSeconds(s, EXERCISES) / 60;
        const tol = M <= 15 ? 3 : 0.1 * M;
        sessionsChecked++;
        worstDev = Math.max(worstDev, Math.abs(est - M) / M);
        ok(Math.abs(est - M) <= tol, `${WT} ${s.id} ${s.name}: ${est.toFixed(1)} min vs ${M}`);
      }
    }
    if (avail(p, PULL)) {
      const mi = mainIt(wk);
      const push = mi.filter(i => PUSH.includes(i.family)).reduce((t, i) => t + i.sets, 0);
      const pull = mi.filter(i => PULL.includes(i.family)).reduce((t, i) => t + i.sets, 0);
      ok(pull > 0, `${WT}: no pull in week`);
      ok(pull >= push * (p.injuries.includes('shoulder') ? 1.5 : 1), `${WT}: pull ${pull} < push ${push}`);
    }
    // QA #1: with a bar (and a vertical pull level), vertical pulling appears every week
    if (levels.pull_vertical && avail(p, ['pull_vertical'])) ok(mainIt(wk).some(i => i.family === 'pull_vertical'), `${WT}: no vertical pull despite a bar`);
    // QA #4: 3-day full body at >= 25 min has three different sessions, and every pattern >= 2x/week
    if (p.daysPerWeek === 3 && p.minutesPerSession >= 25 && wk.sessions.every(s => s.name.startsWith('Full body'))) {
      const keys = wk.sessions.map(s => mainIt({ sessions: [s] }).map(i => i.exerciseId).sort().join());
      ok(new Set(keys).size === 3, `${WT}: A/B/C main work not distinct`);
      for (const [pt, fams] of [['push', PUSH], ['pull', PULL], ['legs', ['squat', 'hinge']]]) {
        if (avail(p, fams)) ok(wk.sessions.filter(s => mainIt({ sessions: [s] }).some(i => fams.includes(i.family))).length >= 2, `${WT}: ${pt} < 2x/week`);
      }
      // v1.2: anti-rotation is core work (world-movement §4.1: it takes Full body C's core slot)
      ok(wk.sessions.filter(s => allItems(s).some(i => i.family.startsWith('core_') || i.family === 'anti_rotation')).length >= 2, `${WT}: core < 2x/week`);
      const cools = wk.sessions.map(s => (s.blocks.find(b => b.kind === 'cooldown') || { items: [] }).items.map(i => i.exerciseId).join());
      ok(new Set(cools).size >= 2, `${WT}: identical stretches every session`);
    }
    const ex = P.explainPlan(p, wk);
    // QA #2: explainPlan states the sets actually delivered
    const cmp = mainIt(wk).filter(i => [...PUSH, ...PULL, 'squat', 'hinge'].includes(i.family) && !/Balance/.test(i.notes));
    const m = ex.join(' ').match(/main lifts get (\d+)(?:-(\d+))? sets/);
    if (cmp.length) ok(m && +m[1] === Math.min(...cmp.map(i => i.sets)) && +(m[2] || m[1]) === Math.max(...cmp.map(i => i.sets)), `${WT}: explainPlan sets '${m && m[0]}' vs delivered ${Math.min(...cmp.map(i => i.sets))}-${Math.max(...cmp.map(i => i.sets))}`);
    ok(!/3-5 sets/.test(ex.join(' ')) || cmp.some(i => i.sets >= 5), `${WT}: explainPlan promises 3-5 sets`);
    ok(Array.isArray(ex) && ex.length >= 4 && ex.length <= 8 && ex.every(x => typeof x === 'string' && x.length > 10), `${WT}: explainPlan ${ex && ex.length}`);
  }
  // deload has fewer sets than the build week before it
  const di = weeks.findIndex(w => w && w.phase === 'deload');
  ok(di > 0, `${T}: no deload in 11 weeks`);
  if (di > 0) ok(mainSets(weeks[di]) < mainSets(weeks[di - 1]), `${T}: deload sets ${mainSets(weeks[di])} !< ${mainSets(weeks[di - 1])}`);
  // determinism
  ok(JSON.stringify(P.generateWeek(p, levels, EXERCISES, 2)) === JSON.stringify(P.generateWeek(clone(p), clone(levels), EXERCISES, 2)), `${T}: not deterministic`);
});

// ---- specific rules
{
  const p = mk({ age: 12 });
  let code = null; try { P.generateWeek(p, {}, EXERCISES, 0); } catch (e) { code = e.code; }
  ok(code === 'AGE_UNDER_13', 'age 12 should throw AGE_UNDER_13');
}
{
  const p = mk({ injuries: ['knee'] });
  ok(P.lowImpactInfo(p).forced, 'knee injury forces low impact');
  ok(!P.lowImpactInfo(mk({ age: 60 })).forced && P.lowImpactInfo(mk({ age: 66 })).forced, 'age 65+ forces low impact (research), 60 does not');
  ok(P.lowImpactInfo(mk({ bmi: 31 })).forced, 'BMI 31 forces low impact');
  const lv = P.initialLevels(mk({ injuries: ['knee'] }), EXERCISES);
  ok(lv.squat === 'split_squat', `knee, no bench: squat via allowed-with-modification split_squat (${lv.squat})`);
  const lv2 = P.initialLevels(mk({ injuries: ['knee'], equipment: ['bench'] }), EXERCISES);
  ok(lv2.squat === 'box_squat', `knee + bench: box_squat (${lv2.squat})`);
}
{
  const L = b => P.initialLevels(mk({ baseline: { pushUps: null, pullUps: null, squats: null, plankSec: null, ...b }, equipment: ALL_EQ }), EXERCISES);
  ok(L({ pushUps: 0 }).push_horizontal === 'incline_push_up', 'pushUps 0 -> incline');
  ok(L({ pushUps: 3 }).push_horizontal === 'knee_push_up', 'pushUps 3 -> knee');
  ok(L({ pushUps: 10 }).push_horizontal === 'push_up', 'pushUps 10 -> push_up');
  ok(L({ pushUps: 20 }).push_horizontal === 'decline_push_up', 'pushUps 20 -> decline');
  ok(L({ pullUps: 7 }).pull_vertical === 'pull_up', 'pullUps 7 -> pull_up');
  ok(L({ squats: 5 }).squat === 'box_squat', 'squats 5 -> box_squat');
  ok(L({ plankSec: 10 }).core_anterior === 'dead_bug', 'plank 10 -> dead_bug');
  ok(!('push_vertical' in L({ pushUps: 5 })), 'pushUps 5 -> no vertical push yet');
  const noWall = P.initialLevels(mk({ experience: 'new' }), EXERCISES);
  ok(noWall.push_horizontal === 'knee_push_up', `ladder gap: no wall/bench -> knee_push_up (${noWall.push_horizontal})`);
  const fem = P.initialLevels(mk({ experience: 'some', sex: 'female', equipment: ALL_EQ }), EXERCISES);
  const mal = P.initialLevels(mk({ experience: 'some', sex: 'male', equipment: ALL_EQ }), EXERCISES);
  ok(byId[fem.push_horizontal].level === byId[mal.push_horizontal].level - 1 && fem.squat === mal.squat, 'female prior: -1 on push only');
}
{ // splits
  const names = p => P.generateWeek(p, P.initialLevels(p, EXERCISES), EXERCISES, 0).sessions.map(s => s.name);
  ok(names(mk({ daysPerWeek: 4, minutesPerSession: 40, experience: 'regular' })).filter(n => n.startsWith('Upper')).length === 2, 'U/L for 4 days');
  ok(names(mk({ daysPerWeek: 6, minutesPerSession: 60, experience: 'regular' })).filter(n => n.startsWith('Push')).length === 2, 'PPL x2 for 6 days >=45 min');
  ok(names(mk({ daysPerWeek: 5, minutesPerSession: 30, experience: 'new' })).filter(n => n.startsWith('Full body')).length === 3, 'new -> full body max 3 hard days');
  const w3 = mk({ daysPerWeek: 3, minutesPerSession: 20 });
  ok(names(w3).join() === 'Full body A,Full body B,Full body A' && P.generateWeek(w3, {}, EXERCISES, 1).sessions.map(s => s.name).join() === 'Full body B,Full body A,Full body B', '3 days <25 min: A/B/A then B/A/B');
}
{ // re-entry from logs
  const p = mk({});
  const lv = P.initialLevels(p, EXERCISES);
  const logs = [{ id: 'x', date: '2026-01-05', weekIndex: 0, sessionId: 'A', items: [] }];
  const w = P.generateWeek(p, lv, EXERCISES, 5, { startDate: '2026-01-05', logs });
  const b = P.generateWeek(p, lv, EXERCISES, 5); // same week, no gap information
  ok(w.meta.reentry === 0.5 && mainSets(w) < mainSets(b), `gap of 35 days -> re-entry x0.5 (${w.meta.reentry})`);
  const w2 = P.generateWeek(p, lv, EXERCISES, 3, { daysSinceLastLog: 15 });
  ok(w2.meta.reentry === 0.75 && w2.phase === 'build', 'daysSinceLastLog 15 -> x0.75 build');
}

// ---- PM QA profile
{
  const p = mk({ age: 42, heightCm: 178, weightKg: 84, experience: 'some', baseline: { pushUps: 10, pullUps: 3, squats: 20, plankSec: 30 }, injuries: ['wrist'],
    equipment: ['wall', 'pullup_bar', 'bench'], goals: ['strength', 'flexibility'], primaryGoal: 'strength', daysPerWeek: 3, minutesPerSession: 30 });
  const lv = P.initialLevels(p, EXERCISES);
  ok(['split_squat', 'reverse_lunge', 'bulgarian_split_squat'].includes(lv.squat), `QA: squats 20 + strength -> harder squat (${lv.squat})`);
  ok(lv.push_horizontal === 'push_up' && lv.pull_vertical === 'chin_up', `QA: push_up / chin_up (${lv.push_horizontal}, ${lv.pull_vertical})`);
  for (let w = 0; w < 5; w++) {
    const wk = P.generateWeek(p, lv, EXERCISES, w);
    if (wk.phase !== 'build') continue;
    const vs = wk.sessions.filter(s => mainIt({ sessions: [s] }).some(i => i.family === 'pull_vertical'));
    ok(vs.length >= 2, `QA w${w}: vertical pull in ${vs.length} sessions`);
    const cmp = mainIt(wk).filter(i => [...PUSH, ...PULL, 'squat', 'hinge'].includes(i.family));
    ok(cmp.every(i => i.sets >= 2), `QA w${w}: compound sets ${cmp.map(i => i.exerciseId + ':' + i.sets)}`);
    for (const s of wk.sessions) {
      const mi = mainIt({ sessions: [s] });
      const firsts = [PUSH, PULL, ['squat', 'hinge']].map(f => mi.find(i => f.includes(i.family))).filter(Boolean);
      ok(firsts.length === 3 && firsts.every(i => i.sets >= 3), `QA w${w} ${s.id}: primary push/pull/legs at 3+ sets ${firsts.map(i => i.exerciseId + ':' + i.sets)}`);
    }
    const row = mainIt(wk).find(i => i.exerciseId === 'inverted_row');
    ok(!row || /low bar or rings/.test(row.notes), 'QA: inverted_row carries the low-bar note');
    ok(new Set(wk.sessions.map(s => mainIt({ sessions: [s] }).map(i => i.exerciseId).sort().join())).size === 3, `QA w${w}: A/B/C distinct`);
    const exs = P.explainPlan(p, wk).join(' ');
    ok(/main lifts get (2-)?3 sets of 4-8 reps/.test(exs) && !/3-5 sets/.test(exs), `QA w${w}: explain states delivered sets (${exs.slice(0, 300)})`);
  }
  const L = (goal, sq) => P.initialLevels(mk({ primaryGoal: goal, goals: [goal], baseline: { pushUps: null, pullUps: null, squats: sq, plankSec: null } }), EXERCISES).squat;
  ok(L('muscle', 20) === 'bodyweight_squat', `muscle goal keeps bodyweight_squat for 20 squats (${L('muscle', 20)})`);
  ok(L('strength', 5) === 'box_squat' || L('strength', 5) === 'bodyweight_squat', 'low baseline not pushed harder');
  const pv = P.initialLevels(mk({ equipment: ALL_EQ, baseline: { pushUps: 20, pullUps: 20, squats: null, plankSec: 70 } }), EXERCISES);
  ok(pv.pull_vertical === 'pull_up' || pv.pull_vertical === 'archer_pull_up', `20 pull-ups, strength -> hard vertical pull (${pv.pull_vertical})`);
  ok(pv.core_anterior === 'hollow_body_hold', `plank 70 s -> hollow (${pv.core_anterior})`);
}
// ---- plan start (QA #5)
{
  ok(P.planStartDate('2026-09-27', [1, 3, 5]) === '2026-09-28', 'created Sunday, Mon/Wed/Fri -> next Monday');
  ok(P.planStartDate('2026-09-23', [1, 3, 5]) === '2026-09-21', 'created Wednesday, Friday still ahead -> this Monday');
  ok(P.planStartDate('2026-09-27', [0, 3]) === '2026-09-21', 'created Sunday with a Sunday session -> this Monday');
  ok(P.planStartDate('2026-09-26', [1, 2]) === '2026-09-28', 'created Saturday, only Mon/Tue -> next Monday');
  ok(P.planStartDate(new Date(2026, 8, 21, 23, 30), [1]) === '2026-09-21', 'Date input, Monday itself');
}

// ---- progression
{
  const p = mk({ equipment: ALL_EQ, experience: 'regular' });
  const lv = { ...P.initialLevels(p, EXERCISES), push_horizontal: 'push_up' };
  const wk = P.generateWeek(p, lv, EXERCISES, 0, { _forceBuild: true });
  const sess = wk.sessions.find(s => allItems(s).some(i => i.exerciseId === 'push_up'));
  const rx = allItems(sess).find(i => i.exerciseId === 'push_up');
  const [lo, hi] = rx.reps;
  const log = (id, date, reps, rating, extra = {}) => ({ id, date, weekIndex: 2, sessionId: sess.id, feel: 3, items: [{ exerciseId: 'push_up', family: 'push_horizontal', sets: reps.map(r => ({ reps: r, done: true })), rating, ...extra }] });
  const L1 = log('a', '2026-03-02', [hi, hi, hi], 'good'), L2 = log('b', '2026-03-04', [hi, hi, hi], 'good');
  let r = P.applySessionLog(lv, p, L2, EXERCISES, [L1]);
  ok(r.levels.push_horizontal === 'decline_push_up' && r.changes.length === 1 && r.changes[0].reason, `advance after 2 top sessions (${r.levels.push_horizontal})`);
  r = P.applySessionLog(lv, p, L2, EXERCISES, []);
  ok(r.levels.push_horizontal === 'push_up' && !r.changes.length, 'no advance after only 1 top session');
  r = P.applySessionLog(lv, p, log('b', '2026-03-04', [hi, hi, hi], 'hard'), EXERCISES, [L1]);
  ok(r.levels.push_horizontal === 'push_up', 'no advance when rated hard');
  const H1 = log('c', '2026-03-02', [lo - 1, lo - 2, lo - 2], 'hard'), H2 = log('d', '2026-03-04', [lo - 1, lo - 1, lo - 2], 'hard');
  r = P.applySessionLog(lv, p, H2, EXERCISES, [H1]);
  ok(r.levels.push_horizontal === 'knee_push_up' && r.changes[0].to === 'knee_push_up', `regress after 2 hard misses (${r.levels.push_horizontal})`);
  r = P.applySessionLog(lv, p, log('e', '2026-03-04', [lo, lo, lo], 'good', { pain: 5 }), EXERCISES, []);
  ok(r.levels.push_horizontal === 'knee_push_up', 'pain > 3 regresses immediately');
  r = P.applySessionLog(lv, p, log('f', '2026-03-04', [hi + 3, hi + 3, hi + 4], 'easy'), EXERCISES, []);
  ok(r.levels.push_horizontal === 'decline_push_up', 'fast-track: easy and hi+3');
  const dlw = P.phaseInfo(p, 0).cycleLen - 1;
  const D1 = { ...L1, weekIndex: dlw }, D2 = { ...L2, weekIndex: dlw };
  r = P.applySessionLog(lv, p, D2, EXERCISES, [D1]);
  ok(r.levels.push_horizontal === 'push_up', 'deload-week logs never advance');
  r = P.applySessionLog(lv, p, log('g', '2026-03-04', [lo, lo + 1, lo], 'good'), EXERCISES, [log('h', '2026-03-02', [lo, lo, lo], 'good')]);
  ok(r.levels.push_horizontal === 'push_up' && !r.changes.length, 'within range: stay');
  const L3 = log('i', '2026-03-06', [hi, hi, hi], 'good');
  ok(JSON.stringify(P.applySessionLog(lv, p, L3, EXERCISES, [L1, L2])) === JSON.stringify(P.applySessionLog(clone(lv), clone(p), clone(L3), EXERCISES, clone([L1, L2]))), 'applySessionLog deterministic');
}

// ---- early start (log before startDate has weekIndex -1)
{
  const p = mk({ equipment: ALL_EQ, experience: 'regular' });
  const lv = { ...P.initialLevels(p, EXERCISES), push_horizontal: 'push_up' };
  const wm1 = P.generateWeek(p, lv, EXERCISES, -1), w0 = P.generateWeek(p, lv, EXERCISES, 0);
  ok(wm1.weekIndex === -1 && JSON.stringify(wm1.sessions) === JSON.stringify(w0.sessions) && wm1.phase === 'build', 'weekIndex -1 = week 1 content');
  const it = w0.sessions.flatMap(s => s.blocks.flatMap(b => b.items)).find(i => i.exerciseId === 'push_up');
  const sid = w0.sessions.find(s => s.blocks.some(b => b.items.includes(it))).id;
  const hi = it.reps[1];
  const early = { id: 'e1', date: '2026-09-27', weekIndex: -1, sessionId: sid, feel: 3, items: [{ exerciseId: 'push_up', family: 'push_horizontal', sets: [hi + 6, hi + 6, hi + 7].map(r => ({ reps: r, done: true })), rating: 'good' }] };
  let r = P.applySessionLog(lv, p, early, EXERCISES, []);
  ok(r.changes.length === 1 && r.levels.push_horizontal === 'diamond_push_up', `early log is a calibration week: +2 levels (${r.levels.push_horizontal})`);
  const e2 = { ...early, id: 'e2', items: [{ ...early.items[0], sets: [hi, hi, hi].map(x => ({ reps: x, done: true })) }] };
  const d2 = { ...e2, id: 'd2', date: '2026-09-28', weekIndex: 0 };
  r = P.applySessionLog(lv, p, d2, EXERCISES, [e2]);
  ok(r.levels.push_horizontal === 'decline_push_up', `early log counts as an exposure for progression (${r.levels.push_horizontal})`);
}

// ---- streaks
{
  const p = mk({ daysPerWeek: 3, preferredDays: [1, 3, 5] }); // Mon Wed Fri
  const L = dates => dates.map((d, i) => ({ id: 's' + i, date: d, sessionId: 'A', items: [] }));
  const day = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  // 2026-09-07 is a Monday
  let s = P.computeStreak(L(['2026-09-07', '2026-09-09', '2026-09-11', '2026-09-14', '2026-09-16']), p, day('2026-09-17'));
  ok(s.current === 5 && s.best === 5, `rest days neutral: 5 scheduled days done (${s.current})`);
  ok(s.weekly.current === 1, `weekly: week 1 kept, week 2 in progress not yet kept (${s.weekly.current})`);
  s = P.computeStreak(L(['2026-09-07', '2026-09-09', '2026-09-11', '2026-09-14']), p, day('2026-09-16'));
  ok(s.current === 4, `today (Wed) untrained does not break (${s.current})`);
  s = P.computeStreak(L(['2026-09-07', '2026-09-09', '2026-09-11', '2026-09-14', '2026-09-18']), p, day('2026-09-19'));
  ok(s.current === 1 && s.freezesUsed === 0, `missed Wed with no freeze breaks (${s.current})`);
  s = P.computeStreak(L(['2026-09-07', '2026-09-10', '2026-09-11']), p, day('2026-09-12'));
  ok(s.current === 3, `±1 day flex: Wed session done Thu counts (${s.current})`);
  // two kept weeks earn a freeze, which covers a later missed day
  const two = ['2026-09-07', '2026-09-09', '2026-09-11', '2026-09-14', '2026-09-16', '2026-09-18'];
  s = P.computeStreak(L(two), p, day('2026-09-20'));
  ok(s.freezeAvailable === true && s.freezesBanked === 1 && s.weekly.current === 2, `2 kept weeks -> 1 freeze (${JSON.stringify(s)})`);
  s = P.computeStreak(L([...two, '2026-09-21', '2026-09-25']), p, day('2026-09-26'));
  ok(s.current === 8 && s.freezesUsed === 1 && s.freezeAvailable === false, `freeze covers missed Wed (${JSON.stringify(s)})`);
  s = P.computeStreak(L(['2026-09-07', '2026-09-07', '2026-09-08', '2026-09-09', '2026-09-10', '2026-09-11']), p, day('2026-09-12'));
  ok(s.current === 3, `extra sessions add nothing (${s.current})`);
  s = P.computeStreak(L([...two, '2026-09-28', '2026-09-30', '2026-10-02']), p, day('2026-10-04'));
  ok(s.weekly.current === 3 && s.weekly.best === 3 && s.freezesUsed >= 1, `missed week rescued by freeze (${JSON.stringify(s.weekly)} used ${s.freezesUsed})`);
  s = P.computeStreak(L([...two, '2026-09-28', '2026-10-12', '2026-10-14', '2026-10-16']), p, day('2026-10-18'));
  ok(s.weekly.current === 1 && s.weekly.best === 2, `two missed weeks with one freeze break the weekly streak (${JSON.stringify(s.weekly)})`);
  s = P.computeStreak([], p, day('2026-10-18'));
  ok(s.current === 0 && s.weekly.current === 0 && s.freezeAvailable === false, 'empty logs');
  // createdOn: logs before it are ignored and the creation week is not penalised
  s = P.computeStreak(L(['2026-08-03', '2026-08-05', '2026-09-24', '2026-09-28', '2026-09-30', '2026-10-02']), p, day('2026-10-04'), { createdOn: '2026-09-23' });
  ok(s.weekly.current === 1 && s.weekly.best === 1 && s.current === 4, `createdOn: creation week neutral, old logs ignored (${JSON.stringify(s)})`);
  s = P.computeStreak(L(['2026-09-30']), mk({ daysPerWeek: 3, preferredDays: [1, 3, 5], createdOn: '2026-09-30' }), day('2026-10-02'));
  ok(s.current === 1 && s.weekly.current === 0, `profile.createdOn midweek start not penalised (${JSON.stringify(s)})`);
  // early start: plan created Sun 2026-09-27, startDate Mon 2026-09-28, first session on the Sunday
  const eo = { createdOn: '2026-09-27', startDate: '2026-09-28' };
  s = P.computeStreak(L(['2026-09-27']), p, day('2026-09-27'), eo);
  ok(s.current === 1 && s.best === 1, `early start: session today -> day streak 1 (${JSON.stringify(s)})`);
  s = P.computeStreak(L(['2026-09-27']), p, day('2026-09-28'), eo);
  ok(s.current === 1, `early start, Monday still open -> 1 (${s.current})`);
  s = P.computeStreak(L(['2026-09-27', '2026-09-30', '2026-10-02']), p, day('2026-10-04'), eo);
  ok(s.current === 3 && s.weekly.current === 1 && s.weekly.best === 1, `early start counts for week 1 (Sun covers Mon via flex; target 3 kept) (${JSON.stringify(s)})`);
  s = P.computeStreak(L(['2026-09-27', '2026-09-30']), p, day('2026-10-04'), eo);
  ok(s.weekly.current === 0, `week 1 with 2 of 3 is not kept (${JSON.stringify(s.weekly)})`);
  s = P.computeStreak(L(['2026-09-27']), { ...p, createdOn: '2026-09-27', startDate: '2026-09-28' }, day('2026-09-27'));
  ok(s.current === 1, 'early start via profile fields');
  s = P.computeStreak(L(['2026-09-24']), p, day('2026-09-24'));
  ok(s.current === 1, `unscheduled Thursday session today -> 1 (${s.current})`);
  const p5 = mk({ daysPerWeek: 5, preferredDays: [1, 2, 3, 5, 6] });
  s = P.computeStreak(L(['2026-09-07', '2026-09-08', '2026-09-09', '2026-09-11']), p5, day('2026-09-14'));
  ok(s.weekly.current === 1, `5 days/week: target 4 allows one miss (${s.weekly.current})`);
  s = P.computeStreak(L(['2026-09-07', '2026-09-09', '2026-09-11']).map((l, i) => i === 1 ? { ...l, sessionId: 'M' } : l), p, day('2026-09-12'));
  ok(s.current === 1 || s.current === 0 || s.current < 3, 'rest-day mobility (M) logs do not count');
}

// ---- quick sessions (v1.1)
let quickChecked = 0;
{
  const GOALS = [undefined, 'strength', 'muscle', 'endurance', 'flexibility', 'skill', 'health'];
  const FOCI = ['full', 'upper', 'lower', 'core', 'push', 'pull', 'legs', 'mobility'];
  const PICKS = [['glutes', 'hamstrings'], ['chest'], ['lats', 'biceps'], ['abs', 'obliques'], ['quads', 'glutes', 'calves'], ['chest', 'front_delts', 'triceps'], ['hip_flexors'], ['lower_back'], ['rear_delts', 'upper_back', 'traps']];
  const MINS = [5, 10, 15, 20, 30, 45, 60, 90];
  const RANGE = { strength: [4, 8], muscle: [6, 20], endurance: [15, 30], health: [8, 15], flexibility: [8, 15], skill: [8, 15] };
  const injured = mk({ injuries: ['wrist', 'knee'], equipment: ['pullup_bar', 'bench', 'wall'], age: 50 });
  const qa = mk({ age: 42, experience: 'some', baseline: { pushUps: 10, pullUps: 3, squats: 20, plankSec: 30 }, injuries: ['wrist'], equipment: ['wall', 'pullup_bar', 'bench'] });
  const noProf = (req) => ({ ...mk({}), sex: 'unspecified', equipment: req.equipment ?? ['wall'], space: req.space || 'medium', lowImpact: !!req.lowImpact });
  const check = (req, prof, tag) => {
    let q;
    try { q = P.generateQuickSession(req, prof, prof ? P.initialLevels(prof, EXERCISES) : null, EXERCISES); } catch (e) { ok(false, `${tag}: threw ${e.stack}`); return null; }
    quickChecked++;
    const eff = prof || noProf(req);
    const items = allItems(q);
    ok(q.id === 'Q' && /^\d+-min \S/.test(q.name), `${tag}: id/name ${q.id} ${q.name}`);
    ok(q.estMinutes === P.estimateMinutes(q, EXERCISES), `${tag}: estMinutes`);
    ok(q.blocks[0] && q.blocks[0].kind === 'warmup' && q.blocks[0].items.length > 0, `${tag}: no warm-up first`);
    const ids = items.map(i => i.exerciseId);
    ok(new Set(ids).size === ids.length, `${tag}: duplicate ${ids}`);
    for (const it of items) ok(byId[it.exerciseId] && P.isAvailable(byId[it.exerciseId], eff), `${tag}: unavailable ${it.exerciseId}`);
    const est = P.estimateSeconds(q, EXERCISES) / 60, M = req.minutes;
    ok(Math.abs(est - M) <= (M <= 10 ? 2 : 0.1 * M), `${tag}: ${est.toFixed(1)} min vs ${M}`);
    const main = q.blocks.filter(b => b.kind === 'main').flatMap(b => b.items);
    if (req.focus === 'mobility' && !req.muscles) {
      // v1.2: gentle rotation drills (rotation family, category mobility) belong in a mobility session
      ok(!main.length && items.every(i => ['mobility', 'warmup', 'conditioning'].includes(i.family) || (i.family === 'rotation' && byId[i.exerciseId].category === 'mobility')), `${tag}: mobility focus has strength work`);
      ok(q.blocks.some(b => b.kind === 'mobility' || b.kind === 'cooldown'), `${tag}: mobility flow missing`);
    }
    if (req.focus === 'core' && !req.muscles) ok(main.length && main.every(i => i.family.startsWith('core_')), `${tag}: core focus has ${main.map(i => i.family)}`);
    if ((req.focus === 'upper' || req.focus === 'push' || req.focus === 'pull') && !req.muscles) ok(!main.some(i => ['squat', 'hinge', 'calves'].includes(i.family)), `${tag}: upper focus has legs`);
    if ((req.focus === 'lower' || req.focus === 'legs') && !req.muscles) ok(!main.some(i => [...PUSH, ...PULL].includes(i.family)), `${tag}: lower focus has upper work`);
    if (req.muscles) {
      const anyAvail = EXERCISES.some(e => e.category !== 'mobility' && e.category !== 'warmup' && (e.muscles.primary || []).some(m => req.muscles.includes(m)) && P.isAvailable(e, eff) && !['conditioning', 'skill_balance'].includes(e.family));
      const hits = main.filter(i => (byId[i.exerciseId].muscles.primary || []).some(m => req.muscles.includes(m)));
      if (anyAvail) ok(hits.length > 0 && (byId[main[0].exerciseId].muscles.primary || []).some(m => req.muscles.includes(m)), `${tag}: first exercise misses ${req.muscles} (${main.map(i => i.exerciseId)})`);
      const cool = q.blocks.find(b => b.kind === 'cooldown');
      const mobHit = EXERCISES.some(e => e.family === 'mobility' && P.isAvailable(e, eff) && [...e.muscles.primary, ...e.muscles.secondary].some(m => req.muscles.includes(m)));
      if (cool && mobHit) ok([...byId[cool.items[0].exerciseId].muscles.primary, ...byId[cool.items[0].exerciseId].muscles.secondary].some(m => req.muscles.includes(m)), `${tag}: cool-down not targeted`);
    }
    // targeted coaching: >= 70% of main sets on the picked muscles, >= 3 exercises at 20+ min, region warm-up drill
    const REG = { push: ['chest', 'front_delts', 'side_delts', 'triceps'], pull: ['rear_delts', 'lats', 'upper_back', 'traps', 'biceps', 'forearms'],
      legs: ['quads', 'glutes', 'hamstrings', 'adductors', 'calves', 'hip_flexors'] };
    REG.upper = [...REG.push, ...REG.pull]; REG.lower = REG.legs;
    const targets = req.muscles || REG[req.focus];
    if (targets && main.length) {
      const regionOfM = m => REG.legs.includes(m) ? 'lower' : (REG.upper.includes(m) ? 'upper' : null);
      const reg = req.muscles ? regionOfM(req.muscles[0]) : (['lower', 'legs'].includes(req.focus) ? 'lower' : 'upper');
      const onTarget = main.filter(i => (byId[i.exerciseId].muscles.primary || []).some(m => targets.includes(m))).reduce((t2, i) => t2 + i.sets, 0);
      const total = main.reduce((t2, i) => t2 + i.sets, 0);
      if (M >= 15) ok(onTarget >= 0.7 * total, `${tag}: only ${onTarget}/${total} main sets on target (${main.map(i => i.exerciseId + ':' + i.sets)})`);
      const pool = EXERCISES.filter(e => [...PUSH, ...PULL, 'squat', 'hinge', 'calves', 'core_anterior', 'core_lateral', 'core_posterior'].includes(e.family)
        && (e.muscles.primary || []).some(m => targets.includes(m)) && P.isAvailable(e, eff)).length;
      if (M >= 20 && pool >= 3) ok(new Set(main.map(i => i.exerciseId)).size >= 3, `${tag}: fewer than 3 main exercises (${main.map(i => i.exerciseId)})`);
      const DRILL = { lower: ['leg_swings', 'hip_circles', 'worlds_greatest_stretch'], upper: ['arm_circles', 'scapular_push_up', 'thoracic_opener', 'wrist_prep'] };
      if (reg && DRILL[reg].some(id => P.isAvailable(byId[id], eff))) ok(q.blocks[0].items.some(i => DRILL[reg].includes(i.exerciseId)), `${tag}: warm-up has no ${reg}-body drill (${q.blocks[0].items.map(i => i.exerciseId)})`);
    }
    const g = req.goal || 'health';
    for (const it of main) if (it.reps && [...PUSH, ...PULL, 'squat', 'hinge'].includes(it.family) && !/Balance/.test(it.notes)) ok(it.reps.join() === RANGE[g].join(), `${tag}: ${it.exerciseId} reps ${it.reps} for ${g}`);
    ok(JSON.stringify(q) === JSON.stringify(P.generateQuickSession(clone(req), prof && clone(prof), prof ? P.initialLevels(prof, EXERCISES) : null, EXERCISES)), `${tag}: not deterministic`);
    return q;
  };
  let n = 0;
  for (const minutes of MINS) for (const goal of GOALS) for (const focus of FOCI) {
    const req = { minutes, goal, focus, date: '2026-09-28' };
    const prof = [null, injured, qa][n++ % 3];
    check(req, prof, `Q ${minutes}m ${goal} ${focus} ${prof ? prof.injuries : 'noprofile'}`);
  }
  for (const minutes of MINS) for (const muscles of PICKS) for (const goal of [undefined, 'strength', 'endurance']) {
    const req = { minutes, goal, muscles, date: '2026-09-28' };
    check(req, null, `Q ${minutes}m ${goal} ${muscles} noprofile`);
    check({ ...req, equipment: ALL_EQ, space: 'large' }, null, `Q ${minutes}m ${goal} ${muscles} noprofile+kit`);
    check(req, injured, `Q ${minutes}m ${goal} ${muscles} injured`);
  }
  // names and specifics
  const q1 = P.generateQuickSession({ minutes: 20, goal: 'strength', focus: 'lower', date: '2026-09-28' }, null, null, EXERCISES);
  ok(q1.name === '20-min Lower body · Strength', `name: ${q1.name}`);
  const q2 = P.generateQuickSession({ minutes: 15, muscles: ['glutes', 'hamstrings'], date: '2026-09-28' }, null, null, EXERCISES);
  ok(q2.name === '15-min Glutes & hamstrings', `name: ${q2.name}`);
  const gh = P.generateQuickSession({ minutes: 20, muscles: ['glutes', 'hamstrings'], date: '2026-09-28' }, null, null, EXERCISES);
  const ghMain = gh.blocks.find(b => b.kind === 'main').items;
  ok(ghMain.length >= 3 && ghMain.every(i => i.sets >= 2) && ghMain.reduce((t2, i) => t2 + i.sets, 0) >= 2.5 * ghMain.length && ghMain.filter(i => i.family === 'hinge').length >= 2
    && ghMain.some(i => i.exerciseId === 'single_leg_rdl' || i.exerciseId === 'nordic_curl_negative'), `PM case glutes/hams 20 min: ${ghMain.map(i => i.exerciseId + ':' + i.sets)}`);
  ok(!gh.blocks[0].items.some(i => i.exerciseId === 'arm_circles'), 'PM case: no arm circles before a glute day');
  const noKit = P.generateQuickSession({ minutes: 30, focus: 'upper', date: '2026-09-28' }, null, null, EXERCISES);
  ok(allItems(noKit).every(i => byId[i.exerciseId].equipment.every(e => e === 'wall')), 'no profile: floor + wall only');
  const inj = P.generateQuickSession({ minutes: 30, focus: 'full', date: '2026-09-28' }, injured, null, EXERCISES);
  ok(!allItems(inj).some(i => !i.flow && byId[i.exerciseId].stress.includes('knee') && i.exerciseId !== 'split_squat'), 'profile injuries honoured (flows adapt their own steps)');
  const dates = new Set(['2026-09-28', '2026-09-29', '2026-09-30', '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04']
    .map(d => JSON.stringify(P.generateQuickSession({ minutes: 30, focus: 'full', date: d }, null, null, EXERCISES).blocks)));
  ok(dates.size >= 2, `variety across dates (${dates.size} distinct of 7)`);
  // Q logs: streaks and progression
  const p = mk({ daysPerWeek: 3, preferredDays: [1, 3, 5], equipment: ALL_EQ });
  const day = s2 => { const [y, m, d] = s2.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  let st = P.computeStreak([{ id: 'q', date: '2026-09-28', sessionId: 'Q', items: [] }], p, day('2026-09-28'));
  ok(st.current === 1, `Q log counts for the day streak (${st.current})`);
  st = P.computeStreak(['2026-09-28', '2026-09-30', '2026-10-02'].map((d, i) => ({ id: 'q' + i, date: d, sessionId: i === 1 ? 'Q' : 'A', items: [] })), p, day('2026-10-04'));
  ok(st.weekly.current === 1 && st.current === 3, `Q log counts toward the weekly target (${JSON.stringify(st)})`);
  st = P.computeStreak(['2026-09-28', '2026-09-30', '2026-10-02'].map((d, i) => ({ id: 'm' + i, date: d, sessionId: i === 1 ? 'M' : 'A', items: [] })), p, day('2026-10-04'));
  ok(st.weekly.current === 0, 'M flow still excluded');
  const lv = { ...P.initialLevels(p, EXERCISES), push_horizontal: 'push_up' };
  const req = { minutes: 20, goal: 'strength', focus: 'push', date: '2026-09-28' };
  const qs = P.generateQuickSession(req, p, lv, EXERCISES);
  const rx = allItems(qs).find(i => i.exerciseId === 'push_up');
  ok(!!rx, 'quick push session uses the profile level (push_up)');
  if (rx) {
    const mkLog = (id, date, reps, rating) => ({ id, date, sessionId: 'Q', request: req, feel: 3, items: [{ exerciseId: 'push_up', family: 'push_horizontal', sets: reps.map(r => ({ reps: r, done: true })), rating }] });
    const hi = rx.reps[1];
    let r = P.applySessionLog(lv, p, mkLog('b', '2026-09-30', [hi, hi, hi], 'good'), EXERCISES, [mkLog('a', '2026-09-28', [hi, hi, hi], 'good')]);
    ok(r.levels.push_horizontal === 'decline_push_up', `Q logs progress families (${r.levels.push_horizontal})`);
    r = P.applySessionLog(lv, p, mkLog('c', '2026-09-30', [hi + 6, hi + 6, hi + 6], 'easy'), EXERCISES, []);
    ok(r.levels.push_horizontal === 'decline_push_up', `Q log without plan week: fast-track +1, not calibration +2 (${r.levels.push_horizontal})`);
    const mixed = [mkLog('a', '2026-09-28', [hi, hi, hi], 'good'), { id: 'w', date: '2026-09-29', weekIndex: 0, sessionId: 'A', feel: 3, items: [{ exerciseId: 'push_up', family: 'push_horizontal', sets: [hi, hi, hi].map(x => ({ reps: x, done: true })), rating: 'good' }] }];
    r = P.applySessionLog(lv, p, mixed[1], EXERCISES, [mixed[0]]);
    ok(r.levels.push_horizontal === 'decline_push_up', 'Q log + plan log are consecutive exposures');
  }
  r0: {
    let threw = null; try { P.generateQuickSession({ minutes: 20 }, mk({ age: 12 }), null, EXERCISES); } catch (e) { threw = e.code; }
    ok(threw === 'AGE_UNDER_13', 'quick session refuses under 13');
  }

  ok(!its.some(i => i.exerciseId === 'baduanjin_look_back'), 'neck: no "wise owl looks back"');
  ok(ALL_BY_ID.rt_trunk_twist.stress.includes('neck') && !its.some(i => i.exerciseId === 'rt_trunk_twist'), 'neck: no standalone Morning Taisō trunk twist');
  bf = flowOf(its, 'baduanjin_sequence'); rf = flowOf(its, 'radio_taiso_1');
  ok(bf && bf.flow.skip.includes('baduanjin_look_back') && bf.flow.skip.includes('baduanjin_sway_head_tail'), `neck: Baduanjin drops the neck pieces (${bf && JSON.stringify(bf.flow.skip)})`);
  ok(rf && /head turns small/.test(rf.notes), 'neck: Morning Taiso caps the neck range');
  ok(rf && !rf.flow.skip.includes('rt_trunk_twist'), 'neck: the Morning Taiso trunk twist stays, in a smaller range');
  its = everything(mk({ injuries: ['wrist'], equipment: [] }));
  ok(!its.some(i => ['dand', 'plank_shoulder_tap'].includes(i.exerciseId)), 'wrist: no daṇḍ, no shoulder taps');
  its = everything(mk({ age: 67, primaryGoal: 'health' }));
  rf = flowOf(its, 'radio_taiso_1');
  ok(rf && rf.flow.replace.rt_two_foot_hops === 'rt_heel_raise' && /heel raises/.test(rf.notes), '65+ (low impact): hops become heel raises');
  ok(P.generateMorningTaiso(mk({ age: 76 }), null, LIB) === null && P.generateMorningTaiso(mk({ age: 66, experience: 'new' }), null, LIB) === null, '75+ / new at 65+: no standing Morning Taiso until the seated version exists');
  ok(!its.some(i => i.flow && i.flow.support === 'soft_gaze'), '65+: never a soft-gaze stage');

  // ---- Quick focus: flow, balance, rotation
  for (const lib of [EXERCISES, LIB]) for (const prof of [null, mk({ age: 60, primaryGoal: 'health' }), mk({ injuries: ['wrist', 'knee'], equipment: ['resistance_band'] })]) {
    for (const minutes of [5, 10, 15, 20, 30, 45, 60, 90]) for (const focus of ['flow', 'balance', 'rotation']) {
      const req = { minutes, focus, date: '2026-10-02' };
      const q = P.generateQuickSession(req, prof, prof ? P.initialLevels(prof, lib) : null, lib);
      const eff = prof || mk({ sex: 'unspecified', equipment: ['wall'] });
      const T = `Q ${lib === LIB ? 'preview' : 'gated'} ${focus} ${minutes}m ${prof ? prof.age + prof.injuries : 'noprofile'}`;
      inv(q, eff, T, 0);
      const est = P.estimateSeconds(q, lib) / 60;
      ok(Math.abs(est - minutes) <= (minutes <= 10 ? 2 : 0.1 * minutes), `${T}: ${est.toFixed(1)} min vs ${minutes}`);
      ok(q.blocks[0].kind === 'warmup' && q.name.startsWith(`${minutes}-min ${{ flow: 'Flow', balance: 'Balance', rotation: 'Rotation' }[focus]}`), `${T}: warm-up first, name ${q.name}`);
      const main = q.blocks.filter(b => b.kind === 'main').flatMap(b => b.items);
      const hasRot = lib.some(e => ['rotation', 'anti_rotation'].includes(e.family));
      if (focus === 'rotation' && minutes >= 10 && hasRot) ok(main.some(i => ['rotation', 'anti_rotation'].includes(i.family)), `${T}: no rotation work (${main.map(i => i.exerciseId)})`);
      // without rotation clips yet (animation gate) the focus falls back to trunk work; the UI hides the chip then
      if (focus === 'rotation' && minutes >= 10 && !hasRot) ok(main.length && main.every(i => i.family.startsWith('core_') || i.family === 'hinge'), `${T}: rotation fallback is trunk work (${main.map(i => i.exerciseId)})`);
      if (focus === 'balance' && minutes >= 10) ok(q.blocks.some(b => b.kind === 'balance'), `${T}: no balance block`);
      if (focus === 'flow') {
        ok(!main.length, `${T}: flow focus has strength work`);
        if (lib === LIB && minutes >= 5 && !(prof && prof.injuries.length > 1 && minutes < 10)) ok(q.blocks.some(b => b.kind === 'flow'), `${T}: no flow block in preview`);
        // gated: a flow block once a flow is animated and verified (Morning Taisō), otherwise the focus falls back to mobility
        const fl = lib === EXERCISES ? P.availableFlows(prof, EXERCISES).length : 0;
        if (lib === EXERCISES && !fl) ok(!q.blocks.some(b => b.kind === 'flow') && q.focus.join() === 'mobility', `${T}: gated flow focus falls back to mobility`);
        if (lib === EXERCISES && fl && minutes >= 10 && !(prof && prof.injuries.length > 1 && minutes < 10)) ok(q.blocks.some(b => b.kind === 'flow'), `${T}: gated flow focus offers the animated, verified flow`);
      }
      ok(JSON.stringify(q) === JSON.stringify(P.generateQuickSession(clone(req), prof && clone(prof), prof ? P.initialLevels(prof, lib) : null, lib)), `${T}: deterministic`);
    }
  }

  // ---- flows count as light days; Morning Taiso keeps the day streak but not the weekly target
  const pf = mk({ primaryGoal: 'flexibility', goals: ['flexibility', 'health'], daysPerWeek: 4, minutesPerSession: 40 });
  wk = P.generateWeek(pf, P.initialLevels(pf, LIB), LIB, 2);
  const light = wk.sessions.filter(s => s.light);
  ok(light.length >= 1 && light.every(s => s.blocks.some(b => b.kind === 'flow')) && light.every(s => s.name === 'Flow & mobility'), `flexibility: light day is a flow day (${wk.sessions.map(s => s.name)})`);
  const ps = mk({ daysPerWeek: 3, preferredDays: [1, 3, 5] });
  const day = s2 => { const [y, m, d] = s2.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const L = (arr) => arr.map(([d, sid], i) => ({ id: 'x' + i, date: d, sessionId: sid, items: [] }));
  let st = P.computeStreak(L([['2026-09-07', 'T'], ['2026-09-09', 'T'], ['2026-09-11', 'T']]), ps, day('2026-09-12'));
  ok(st.current === 3 && st.weekly.current === 0, `Morning Taiso on every scheduled day: day streak 3, weekly target not met (${JSON.stringify(st)})`);
  st = P.computeStreak(L([['2026-09-07', 'A'], ['2026-09-09', 'T'], ['2026-09-11', 'B'], ['2026-09-14', 'A'], ['2026-09-16', 'B'], ['2026-09-18', 'C']]), ps, day('2026-09-20'));
  ok(st.current === 6 && st.weekly.current === 1 && st.weekly.best === 1, `Taiso keeps the day streak alive; week 1 (2 sessions + Taiso) misses the target (${JSON.stringify(st)})`);
  st = P.computeStreak(L([['2026-09-07', 'A'], ['2026-09-07', 'T'], ['2026-09-09', 'B'], ['2026-09-11', 'C']]), ps, day('2026-09-13'));
  ok(st.current === 3 && st.weekly.current === 1, `Taiso on a session day adds nothing (${JSON.stringify(st)})`);
  st = P.computeStreak(L([['2026-09-07', 'A'], ['2026-09-09', 'B'], ['2026-09-11', 'C'], ['2026-09-14', 'T']]), ps, day('2026-09-14'));
  ok(st.current === 4 && st.weekly.current === 1, `Taiso today counts for the day streak (${JSON.stringify(st)})`);
  const pg = mk({});
  const glogs = [{ id: 'a', date: '2026-01-05', weekIndex: 0, sessionId: 'A', items: [] }, ...['2026-01-20', '2026-01-27', '2026-02-03'].map((d, i) => ({ id: 't' + i, date: d, sessionId: 'T', items: [] }))];
  ok(P.generateWeek(pg, P.initialLevels(pg, LIB), LIB, 5, { startDate: '2026-01-05', logs: glogs }).meta.reentry === 0.5, 'Morning Taiso logs do not hide a training gap (re-entry still applies)');
  const mt = P.generateMorningTaiso(null, null, LIB);
  ok(mt && mt.id === P.MORNING_TAISO_SESSION_ID && mt.light && mt.blocks[0].items[0].exerciseId === 'radio_taiso_1' && mt.estMinutes >= 3 && mt.estMinutes <= 4, `generateMorningTaiso: a 3-4 min 'T' session (${mt && mt.estMinutes})`);

  // ---- flow progression (§4.4)
  const pt = mk({ age: 50, primaryGoal: 'health', goals: ['health', 'balance'] });
  let lv = P.initialLevels(pt, LIB);
  const flog = (id, date, rating, extra = {}) => ({ id, date, weekIndex: 2, sessionId: 'A', feel: 3, items: [{ exerciseId: 'taichi_short_flow', family: 'flow_sequence', sets: [{ sec: 150, done: true }], rating, ...extra }] });
  let r = P.applySessionLog(lv, pt, flog('f1', '2026-03-02', 'easy'), LIB, []);
  ok(r.levels.flowStages.taichi_short_flow.stage === 0 && r.levels.flowStages.taichi_short_flow.easy === 1 && !r.changes.length, 'flow: one easy rating counts, no change yet');
  ok(!lv.flowStages, 'applySessionLog does not mutate the input levels');
  r = P.applySessionLog(r.levels, pt, flog('f2', '2026-03-04', 'easy'), LIB, []);
  ok(r.levels.flowStages.taichi_short_flow.stage === 1 && r.changes.length === 1 && r.changes[0].flow && r.changes[0].up && /no chair/.test(r.changes[0].reason), `flow: easy twice unlocks the next stage (${JSON.stringify(r.changes)})`);
  let r2 = P.applySessionLog(r.levels, pt, flog('f3', '2026-03-06', 'hard'), LIB, []);
  ok(r2.levels.flowStages.taichi_short_flow.stage === 1 && r2.levels.flowStages.taichi_short_flow.easy === 0 && !r2.changes.length, 'flow: hard keeps the stage');
  r2 = P.applySessionLog(r.levels, pt, flog('f4', '2026-03-06', 'good', { pain: 6 }), LIB, []);
  ok(r2.levels.flowStages.taichi_short_flow.stage === 0 && r2.changes[0] && !r2.changes[0].up, 'flow: pain > 3 steps back');
  const at = (stage, p = pt) => { const w = P.generateWeek(p, { ...P.initialLevels(p, LIB), flowStages: { taichi_short_flow: { stage, easy: 0 } } }, LIB, 2); return weekItems(w).find(i => i.exerciseId === 'taichi_short_flow'); };
  const s0 = at(0), s2 = at(2);
  ok(s0 && s2 && s2.flow.stance === 'medium' && s2.flow.tempoScale > 1 && s2.holdSec[0] > s0.holdSec[0], `flow: stage 2 is a medium stance, slower and longer (${s0 && s0.holdSec[0]} -> ${s2 && s2.holdSec[0]})`);
  const sk = at(4, mk({ age: 50, primaryGoal: 'health', goals: ['health', 'balance'], injuries: ['knee'] }));
  ok(sk && sk.flow.stance === 'high', 'flow: a knee problem keeps the stance high at any stage');
  const old = mk({ age: 70, primaryGoal: 'health' });
  let lo = { ...P.initialLevels(old, LIB), flowStages: { taichi_short_flow: { stage: 4, easy: 1 } } };
  r = P.applySessionLog(lo, old, flog('o1', '2026-03-02', 'easy'), LIB, []);
  ok(r.levels.flowStages.taichi_short_flow.stage === 4, '65+: the soft-gaze stage is never unlocked');
  const bdLight = P.generateWeek(pf, { ...P.initialLevels(pf, LIB), flowStages: { baduanjin_sequence: { stage: 2, easy: 0 } } }, LIB, 2);
  const bd = weekItems(bdLight).find(i => i.exerciseId === 'baduanjin_sequence' && bdLight.sessions.some(s => s.light && allIt(s).includes(i)));
  ok(bd && bd.flow.variant === 'full', `flow: Baduanjin stage 2 is the full version on a light day (${bd && bd.flow.variant})`);

  // ---- saved state from v1.1 still works (additive schema)
  const v11 = { push_horizontal: 'push_up', squat: 'bodyweight_squat', pull_vertical: 'dead_hang', core_anterior: 'plank' };
  const w11 = P.generateWeek(mk({ equipment: ['pullup_bar'] }), v11, EXERCISES, 3);
  ok(w11.sessions.length === 3 && weekItems(w11).some(i => i.exerciseId === 'push_up'), 'v1.1 levels (no rotation keys) still plan, keeping earned levels');
  setTraditionPreview(false);
  ok(!traditionPreview() && EXERCISES.every(isVisible), 'preview switched back off');
}

// ---- flows: every step ends on a whole clip cycle at the flow player's pace (no cut mid-movement)
{
  const K = await import('../js/anim/v2/core.js');
  const { CLIPS } = await import('../js/anim/v2/clips.js');
  const V = { radio_taiso_1: [{}, { replace: { rt_two_foot_hops: 'rt_heel_raise' } }], taichi_short_flow: [{}], baduanjin_sequence: [{}, { variant: 'short' }] };
  for (const [id, opts] of Object.entries(V)) for (const o of opts) for (const st of flowSteps(id, o)) {
    const anim = st.exercise?.anim || st.move || st.anim, c = CLIPS[anim], T = K.period(c);
    const count = st.reps ? (st.side === 'both' ? st.reps * 2 : st.reps) : 0;   // as the workout player counts
    const rate = count && c.counts ? T / (c.counts * (st.sec / count)) : T * Math.max(1, Math.round(st.sec / T)) / st.sec;   // plate.js rateOf
    const cycles = st.sec * rate / T;
    ok(Math.abs(cycles - Math.round(cycles)) < 1e-6 && cycles >= 1, `${id}${o.variant ? ' ' + o.variant : ''} ${anim}: ${cycles.toFixed(2)} cycles in the step`);
  }
  const tw = ALL_BY_ID.radio_taiso_1.sequence.find(x => x.move === 'rt_trunk_twist');
  ok(tw.side === 'alternate' && tw.reps === 8, 'Morning Taisō trunk twist alternates every count (its clip goes one way, then the other)');
  ok(ALL_BY_ID.radio_taiso_1.sequence.find(x => x.move === 'rt_arm_circles').cue === 'Big circles, out, then in', 'arm circles cue: out, then in (as the clip)');
  // the plan explanation names a one-leg hold only when the golden rooster is planned
  for (const pp of [mk({ primaryGoal: 'balance', goals: ['balance'], daysPerWeek: 3, minutesPerSession: 30 }), mk({ age: 60, primaryGoal: 'health', daysPerWeek: 3 })]) {
    const wk = P.generateWeek(pp, P.initialLevels(pp, EXERCISES), EXERCISES, 2);
    const rooster = wk.sessions.some(s => s.blocks.some(b => b.kind === 'balance' && b.items.some(i => i.exerciseId === 'taichi_golden_rooster')));
    ok(P.explainPlan(pp, wk).some(b => /one-leg hold/.test(b)) === rooster, `explainPlan mentions a one-leg hold only when planned (${rooster})`);
  }
}

// ---- Quick "train for a goal": the goal chooses the content, not only the dose (founder report, v1.2)
let goalChecked = 0, poolChecked = 0;
const contentOf = q => q.blocks.filter(b => !['warmup', 'cooldown'].includes(b.kind)).flatMap(b => b.items);
const quickSample = mk({ age: 42, sex: 'female', experience: 'regular', baseline: { pushUps: 12, pullUps: 2, squats: 25, plankSec: 45 }, equipment: ['pullup_bar', 'resistance_band', 'wall'] });
{
  const GOALS = ['strength', 'muscle', 'health', 'endurance', 'flexibility', 'skill', 'balance'];
  // Overlap limit (Jaccard of the content moves: everything outside warm-up and cool-down). At 5 min a goal has only 2-3 content moves,
  // so one shared move out of a union of 3 is exactly 1/3 and is tolerated (e.g. one supporting move); two shared moves give >= 1/2.
  const LIMIT = 0.34;
  // strength, muscle and health keep the full-body patterns by design (research §1.1: the goal sets reps, sets and rest; the family
  // level is the intensity), so these three pairs may share moves and must differ in dose instead.
  const SAME_CONTENT = new Set(['health|muscle', 'health|strength', 'muscle|strength']);
  const jac = (a, b) => { const A = new Set(a), B = new Set(b), u = new Set([...A, ...B]); return u.size ? [...A].filter(x => B.has(x)).length / u.size : 0; };
  const SKILL_IDS = ['crow_pose', 'wall_handstand', 'freestanding_handstand', 'l_sit', 'hollow_body_hold', 'taichi_golden_rooster'];
  const balanceItem = (it, b) => { const ex = byId[it.exerciseId]; return b.kind === 'balance' || ex.category === 'balance' || ex.family === 'flow_taichi' || it.exerciseId === 'taichi_short_flow'
    || ex.family === 'anti_rotation' || (ex.unilateral && ['squat', 'hinge', 'calves'].includes(ex.family)); };
  const flexItem = it => { const ex = byId[it.exerciseId]; return ex.family === 'mobility' || ex.category === 'mobility' || ex.mode === 'flow' || /^flow_/.test(ex.family)
    || (ex.family === 'rotation' && ex.level <= 3); };
  const noProf = req => ({ ...mk({}), sex: 'unspecified', equipment: req.equipment ?? ['wall'], space: req.space || 'medium', lowImpact: !!req.lowImpact });
  const PROFS = [[null, 'noprofile', true], [quickSample, 'sample', true], [mk({ equipment: ALL_EQ, experience: 'advanced', space: 'large' }), 'kit', true],
    [mk({ injuries: ['wrist'] }), 'wrist'], [mk({ injuries: ['wrist', 'shoulder', 'neck'] }), 'wrist+shoulder+neck'], [mk({ injuries: ['knee', 'ankle'], age: 60 }), 'knee+ankle 60'],
    [mk({ injuries: ['lower_back'], equipment: ['resistance_band'] }), 'lower back+band'], [mk({ lowImpact: true, space: 'small' }), 'low impact, small'],
    [mk({ age: 70, experience: 'new', primaryGoal: 'health' }), '70 new'], [mk({ injuries: ['hip'], equipment: ['bench'] }), 'hip+bench'], [mk({ age: 16 }), '16']];
  for (const [prof, pname, overlap] of PROFS) for (const minutes of [5, 10, 15, 20, 30, 45]) {
    const qs = {};
    for (const goal of GOALS) {
      const req = { minutes, goal, date: '2026-09-28' };
      const T = `goal ${goal} ${minutes}m ${pname}`;
      let q;
      try { q = P.generateQuickSession(req, prof, prof ? P.initialLevels(prof, EXERCISES) : null, EXERCISES); } catch (e) { ok(false, `${T}: threw ${e.stack}`); continue; }
      qs[goal] = q; goalChecked++;
      const eff = prof || noProf(req);
      const its = allItems(q), content = contentOf(q), main = q.blocks.filter(b => b.kind === 'main').flatMap(b => b.items);
      const est = P.estimateSeconds(q, EXERCISES) / 60;
      ok(Math.abs(est - minutes) <= (minutes <= 10 ? 2 : 0.1 * minutes), `${T}: ${est.toFixed(1)} min`);
      ok(q.blocks[0].kind === 'warmup' && content.length > 0, `${T}: warm-up first and some content (${q.blocks.map(b => b.kind)})`);
      ok(new Set(its.map(i => i.exerciseId)).size === its.length, `${T}: duplicates`);
      ok(its.every(i => byId[i.exerciseId] && P.isAvailable(byId[i.exerciseId], eff)), `${T}: unavailable ${its.filter(i => !P.isAvailable(byId[i.exerciseId], eff)).map(i => i.exerciseId)}`);
      ok(JSON.stringify(q) === JSON.stringify(P.generateQuickSession(clone(req), prof && clone(prof), prof ? P.initialLevels(prof, EXERCISES) : null, EXERCISES)), `${T}: deterministic`);
      const has = ids => ids.some(id => byId[id] && P.isAvailable(byId[id], eff));
      if (goal === 'balance') {
        const balOk = q.blocks.some(b => b.kind !== 'warmup' && b.kind !== 'cooldown' && b.items.some(i => balanceItem(i, b)));
        ok(balOk, `${T}: no balance or single-leg item (${content.map(i => i.exerciseId)})`);
        ok(!main.some(i => [...PUSH, ...PULL].includes(i.family)), `${T}: push/pull in a balance session (${main.map(i => i.exerciseId)})`);
        ok(main.filter(i => ['squat', 'hinge', 'calves'].includes(i.family)).every(i => /Slow and controlled/.test(i.notes)), `${T}: single-leg work without the slow tempo note`);
        ok(q.name === `${minutes}-min Balance`, `${T}: name ${q.name}`);
      }
      if (goal === 'skill') {
        const skillBlk = q.blocks.find(b => b.kind === 'skill');
        const anySkill = EXERCISES.some(e => (e.family === 'skill_balance' || SKILL_IDS.includes(e.id)) && P.isAvailable(e, eff));
        if (anySkill) ok(skillBlk && q.blocks[1] === skillBlk && skillBlk.items.every(i => i.rir >= 3 && i.sets >= 2), `${T}: skill practice not first (${q.blocks.map(b => b.kind)})`);
        const sb = EXERCISES.filter(e => e.family === 'skill_balance' && P.isAvailable(e, eff));
        if (sb.length && skillBlk) ok(byId[skillBlk.items[0].exerciseId].family === 'skill_balance', `${T}: first skill item ${skillBlk.items[0].exerciseId} although a handbalance is possible`);
        if (skillBlk) ok(P.estimateSeconds({ blocks: [skillBlk] }, EXERCISES) <= 630, `${T}: skill practice over 10 min`);
      }
      if (goal === 'flexibility') {
        ok(!main.length && content.every(flexItem), `${T}: flexibility content is not mobility (${content.map(i => i.exerciseId)})`);
        ok(q.blocks.some(b => b.kind === 'mobility' && b.items.some(i => byId[i.exerciseId].mode === 'hold')) || minutes <= 5, `${T}: no held stretch`);
        ok(!q.blocks.some(b => b.kind === 'conditioning'), `${T}: conditioning in a flexibility session`);
      }
      if (goal === 'endurance') {
        const cond = main.filter(i => i.family === 'conditioning');
        const condAvail = EXERCISES.filter(e => e.family === 'conditioning' && P.isAvailable(e, eff)).length;
        if (condAvail >= 2) ok(cond.length >= Math.min(2, condAvail), `${T}: fewer than 2 conditioning moves (${main.map(i => i.exerciseId)})`);
        if (condAvail >= 3 && minutes >= 10) ok(cond.some(i => i.superset != null), `${T}: conditioning not in a circuit`);
        ok(main.every(i => !i.reps || i.reps[0] >= 15 || /Balance/.test(i.notes) || i.family === 'conditioning' || ['core_anterior', 'core_lateral', 'anti_rotation'].includes(i.family)), `${T}: endurance reps below 15`);
        ok(cond.every(i => i.restSec <= (eff.age >= 65 ? 90 : 45)), `${T}: long rests in the circuit (${cond.map(i => i.restSec)})`);
      }
    }
    // strength, muscle, health: same patterns, different dose
    const doseOf = q => q && JSON.stringify(q.blocks.filter(b => b.kind === 'main').flatMap(b => b.items).map(i => [i.reps, i.holdSec, i.restSec]));
    for (const [a, b] of [['strength', 'muscle'], ['strength', 'health'], ['muscle', 'health']]) ok(doseOf(qs[a]) !== doseOf(qs[b]), `goal ${minutes}m ${pname}: ${a} and ${b} have the same dose`);
    // 5-20 min: at 30+ a health session adds its own short conditioning block (research §1.3), which can share cardio moves with endurance
    if (!overlap || ![5, 10, 15, 20].includes(minutes)) continue;
    for (let i = 0; i < GOALS.length; i++) for (let k = i + 1; k < GOALS.length; k++) {
      const [a, b] = [GOALS[i], GOALS[k]].sort();
      if (SAME_CONTENT.has(`${a}|${b}`) || !qs[a] || !qs[b]) continue;
      const j = jac(contentOf(qs[a]).map(x => x.exerciseId), contentOf(qs[b]).map(x => x.exerciseId));
      ok(j <= LIMIT, `goal overlap ${minutes}m ${pname} ${a}/${b}: Jaccard ${j.toFixed(2)} (${contentOf(qs[a]).map(x => x.exerciseId)} | ${contentOf(qs[b]).map(x => x.exerciseId)})`);
    }
  }
  // the founder's reproduction: the four goals no longer give the same 5-min session
  const five = ['balance', 'skill', 'strength', 'flexibility'].map(g => contentOf(P.generateQuickSession({ minutes: 5, goal: g }, null, null, EXERCISES)).map(i => i.exerciseId).join());
  ok(new Set(five).size === 4, `5 min balance/skill/strength/flexibility differ (${five.join(' | ')})`);
  // body-area and muscle targeting are untouched: an area wins over the goal
  const up = P.generateQuickSession({ minutes: 20, goal: 'balance', focus: 'upper', date: '2026-09-28' }, null, null, EXERCISES);
  ok(up.name === '20-min Upper body · Balance' && !up.blocks.some(b => b.kind === 'balance') && contentOf(up).some(i => PUSH.includes(i.family)), `area wins over the goal (${up.name})`);
  const gl = P.generateQuickSession({ minutes: 20, goal: 'flexibility', muscles: ['glutes'], date: '2026-09-28' }, null, null, EXERCISES);
  ok(gl.name === '20-min Glutes · Flexibility' && contentOf(gl).some(i => byId[i.exerciseId].muscles.primary.includes('glutes')), `muscles win over the goal (${gl.name})`);
  // gated library: with every tradition hidden the goals still hold (generic single-leg work, stretches without flows)
  const saved = Object.fromEntries(Object.entries(TRADITIONS).map(([k, t]) => [k, t.verified]));
  for (const t of Object.values(TRADITIONS)) if (t.kind !== 'explainer') t.verified = null;
  const hiddenLib = ALL_EXERCISES.filter(isVisible);
  for (const m of [5, 10, 20]) {
    const b = P.generateQuickSession({ minutes: m, goal: 'balance' }, null, null, ALL_EXERCISES), f2 = P.generateQuickSession({ minutes: m, goal: 'flexibility' }, null, null, ALL_EXERCISES);
    ok(allItems(b).concat(allItems(f2)).every(i => !ALL_BY_ID[i.exerciseId].tradition && isVisible(ALL_BY_ID[i.exerciseId])), `gated ${m}m: tradition items in balance/flexibility`);
    ok(contentOf(b).some(i => ALL_BY_ID[i.exerciseId].unilateral), `gated ${m}m balance: single-leg work (${contentOf(b).map(i => i.exerciseId)})`);
    ok(contentOf(f2).every(i => ALL_BY_ID[i.exerciseId].family === 'mobility' || ALL_BY_ID[i.exerciseId].category === 'mobility'), `gated ${m}m flexibility: stretches only`);
  }
  for (const [k, v] of Object.entries(saved)) TRADITIONS[k].verified = v;
  void hiddenLib;
}

// ---- Library pool sessions: a workout of a chosen length from a tradition, a category or a family
{
  const TRADS = Object.keys(TRADITIONS);
  const CATS = ['strength', 'core', 'skill', 'conditioning', 'mobility', 'warmup', 'flow', 'balance', 'breath'];
  const FAMS = ['squat', 'mobility', 'flow_taichi', 'core_lateral', 'anti_rotation', 'skill_balance'];
  const filters = [...TRADS.map(t => ({ tradition: t })), ...CATS.map(c => ({ category: c })), ...FAMS.map(f => ({ family: f })), { tradition: 'tai_chi', category: 'balance' }];
  const PROFS = [[null, 'noprofile'], [quickSample, 'sample'], [mk({ injuries: ['knee', 'wrist'], age: 60, lowImpact: true, space: 'small' }), 'knee+wrist 60 small low'],
    [mk({ injuries: ['lower_back', 'neck'], equipment: ['resistance_band', 'wall'] }), 'back+neck band'], [mk({ injuries: ['wrist', 'shoulder'] }), 'wrist+shoulder'],
    [mk({ age: 70, experience: 'new', primaryGoal: 'health' }), '70 new']];
  const noProf = () => ({ ...mk({}), sex: 'unspecified', equipment: ['wall'], space: 'medium', lowImpact: false });
  for (const [prof, pname] of PROFS) for (const f of filters) for (const minutes of [5, 10, 20]) {
    const req = { minutes, ...f, date: '2026-09-28' };
    const T = `pool ${JSON.stringify(f)} ${minutes}m ${pname}`;
    let q;
    try { q = P.generateQuickSession(req, prof, prof ? P.initialLevels(prof, EXERCISES) : null, EXERCISES); } catch (e) { ok(false, `${T}: threw ${e.stack}`); continue; }
    poolChecked++;
    const eff = prof || noProf();
    const pool = new Set(P.quickPoolIds(f, prof, EXERCISES));
    const its = allItems(q);
    const content = f.category === 'warmup' ? its.filter(i => !q.blocks.find(b => b.kind === 'cooldown')?.items.includes(i)) : contentOf(q);
    ok(content.length > 0, `${T}: empty session`);
    ok(f.category === 'warmup' || q.blocks[0].kind === 'warmup', `${T}: warm-up first`);
    ok(new Set(its.map(i => i.exerciseId)).size === its.length, `${T}: duplicates`);
    ok(its.every(i => byId[i.exerciseId] && P.isAvailable(byId[i.exerciseId], eff) && isVisible(byId[i.exerciseId])), `${T}: unavailable ${its.filter(i => !P.isAvailable(byId[i.exerciseId], eff)).map(i => i.exerciseId)}`);
    ok([...pool].every(id => P.isAvailable(byId[id], eff)), `${T}: pool lists unavailable items`);
    const est = P.estimateSeconds(q, EXERCISES) / 60;
    ok(Math.abs(est - minutes) <= (minutes <= 10 ? 2 : 0.1 * minutes), `${T}: ${est.toFixed(1)} min (${q.blocks.map(b => b.kind + ':' + b.items.map(i => i.exerciseId + 'x' + i.sets))})`);
    ok(q.id === 'Q' && q.name.startsWith(`${minutes}-min `) && q.estMinutes === P.estimateMinutes(q, EXERCISES), `${T}: id/name/estMinutes ${q.name}`);
    ok(JSON.stringify(q.pool) === JSON.stringify(f), `${T}: pool echo ${JSON.stringify(q.pool)}`);
    ok(JSON.stringify(q) === JSON.stringify(P.generateQuickSession(clone(req), prof && clone(prof), prof ? P.initialLevels(prof, EXERCISES) : null, EXERCISES)), `${T}: deterministic`);
    const inPool = content.filter(i => pool.has(i.exerciseId));
    const secOf = list => P.estimateSeconds({ blocks: [{ items: list.map(i => ({ ...i, superset: null })) }] }, EXERCISES);
    if (!pool.size) ok(typeof q.note === 'string' && /suit you right now/.test(q.note), `${T}: empty pool without a note`);
    else {
      ok(inPool.length > 0, `${T}: nothing from the pool (${content.map(i => i.exerciseId)})`);
      // mostly inside the pool: anything else in the content, or pool work under half the content time, must come with a note
      const outside = content.filter(i => !pool.has(i.exerciseId));
      if (outside.length || secOf(inPool) < 0.5 * secOf(content)) ok(typeof q.note === 'string' && q.note.length > 20, `${T}: filled outside the pool without a note (${outside.map(i => i.exerciseId)})`);
      if (!q.note) ok(!outside.length, `${T}: no note but outside items`);
    }
  }
  // specifics the founder named
  const tc5 = P.generateQuickSession({ minutes: 5, tradition: 'tai_chi' }, null, null, EXERCISES);
  ok(contentOf(tc5).every(i => ALL_BY_ID[i.exerciseId].tradition === 'tai_chi'), `5-min Tai Chi is all Tai Chi (${contentOf(tc5).map(i => i.exerciseId)})`);
  const bd10 = P.generateQuickSession({ minutes: 10, tradition: 'baduanjin' }, null, null, EXERCISES);
  ok(contentOf(bd10).some(i => i.exerciseId === 'baduanjin_sequence'), `10-min Baduanjin has the sequence (${contentOf(bd10).map(i => i.exerciseId + (i.flow ? ':' + i.flow.variant : ''))})`);
  const rt10 = P.generateQuickSession({ minutes: 10, tradition: 'radio_taiso' }, null, null, EXERCISES);
  const rtIt = contentOf(rt10).find(i => i.exerciseId === 'radio_taiso_1');
  ok(rtIt && (rtIt.sets >= 2 || contentOf(rt10).length > 1), `10-min Morning Taisō repeats or adds related moves (${contentOf(rt10).map(i => i.exerciseId + 'x' + i.sets)})`);
  const hs = P.generateQuickSession({ minutes: 20, tradition: 'horse_stance' }, null, null, EXERCISES);
  ok(/single hold/.test(hs.note || '') && contentOf(hs).some(i => i.exerciseId === 'horse_stance') && contentOf(hs).some(i => ['squat', 'hinge', 'calves'].includes(i.family)), `20-min Horse stance: leg work around it, with a note (${hs.note})`);
  const cardio = P.generateQuickSession({ minutes: 10, category: 'conditioning', lowImpact: true }, null, null, EXERCISES);
  ok(allItems(cardio).every(i => ALL_BY_ID[i.exerciseId].impact !== 'high'), 'low-impact cardio has no jumping');
  // precedence: muscles > pool > focus / goal
  const mp = P.generateQuickSession({ minutes: 15, muscles: ['chest'], tradition: 'tai_chi' }, null, null, EXERCISES);
  ok(!mp.pool && /Chest/.test(mp.name), `muscles win over a pool (${mp.name})`);
  const pg = P.generateQuickSession({ minutes: 15, goal: 'strength', focus: 'upper', category: 'mobility' }, null, null, EXERCISES);
  ok(pg.name === '15-min Mobility' && contentOf(pg).every(i => ALL_BY_ID[i.exerciseId].category === 'mobility' || i.flow), `a pool wins over focus and goal (${pg.name})`);
  ok(P.quickPoolIds({ tradition: 'no_such_tradition' }, null, EXERCISES).length === 0 && P.quickPoolIds({ category: 'mobility' }, null, EXERCISES).length > 5, 'quickPoolIds: unknown ids match nothing');
  // accuracy and animation gates: a hidden tradition gives an empty pool, whichever library is passed
  const v = TRADITIONS.tai_chi.verified; TRADITIONS.tai_chi.verified = null;
  const hid = P.generateQuickSession({ minutes: 10, tradition: 'tai_chi' }, null, null, ALL_EXERCISES);
  ok(!allItems(hid).some(i => ALL_BY_ID[i.exerciseId].tradition === 'tai_chi') && /suit you right now/.test(hid.note || '') && P.quickPoolIds({ tradition: 'tai_chi' }, null, ALL_EXERCISES).length === 0,
    `unverified Tai Chi: nothing offered (${allItems(hid).map(i => i.exerciseId)})`);
  TRADITIONS.tai_chi.verified = v;
  const full = P.generateQuickSession({ minutes: 20, category: 'mobility' }, null, null, ALL_EXERCISES);
  ok(allItems(full).every(i => isVisible(ALL_BY_ID[i.exerciseId])), 'full library: pool sessions offer only visible (verified, animated) items');
}

// ---- sample
{
  const p = grid[0 + 13];
  const w = P.generateWeek(p, P.initialLevels(p, EXERCISES), EXERCISES, 0);
  document.getElementById('sample').textContent = [grid[12], grid[22], grid[4]].map(pp => {
    const wk = P.generateWeek(pp, P.initialLevels(pp, EXERCISES), EXERCISES, 0);
    return JSON.stringify(pp) + '\n' + P.explainPlan(pp, wk).map(b => ' • ' + b).join('\n') + '\n' +
      wk.sessions.map(s => `${s.id} ${s.name} ~${s.estMinutes}m [${s.focus}]\n` + s.blocks.map(b => `  ${b.title}: ` + b.items.map(i => `${i.exerciseId} ${i.sets}x${i.reps ? i.reps.join('-') : i.holdSec.join('-') + 's'}${i.perSide ? '/side' : ''} r${i.restSec}${i.superset ? ' S' + i.superset : ''}`).join(', ')).join('\n')).join('\n');
  }).join('\n\n');
  void w;
}

const el = document.getElementById('summary');
el.innerHTML = `<span class="${fail ? 'fail' : 'pass'}">${pass} passed, ${fail} failed</span> · ${grid.length} profiles · ${sessionsChecked} build sessions timed · worst time deviation ${(worstDev * 100).toFixed(1)}% · ${quickChecked} quick sessions · ${v12Checked} v1.2 sessions · ${goalChecked} goal-led · ${poolChecked} pool sessions`;
document.getElementById('fails').textContent = fails.join('\n') || 'All tests passed.';
window.__results = { pass, fail, fails, sessionsChecked, worstDev, quickChecked, v12Checked, passBeforeV12, failBeforeV12, goalChecked, poolChecked };
</script>
